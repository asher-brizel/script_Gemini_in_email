name: Gemini Email Bot

on:
  schedule:
    - cron: '* * * * *'   # כל דקה
  workflow_dispatch:

concurrency:
  group: gemini-email-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ✅ Restore cache of answered_ids.txt so state persists across runs
      - name: Restore answered_ids cache
        uses: actions/cache@v4
        with:
          path: answered_ids.txt
          key: answered-ids-${{ github.run_id }}
          restore-keys: |
            answered-ids-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests markdown

      - name: Run bot
        env:
          EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          LOOKBACK_MINUTES: "180"
          MAX_EMAILS_PER_RUN: "30"
          DEFAULT_MAX_OUTPUT_TOKENS: "1200"
          STATE_FILE: "answered_ids.txt"
          STATE_MAX_IDS: "5000"
          MAX_CONTINUATIONS: "2"
          MIN_NORMAL_CHARS: "180"
        run: |
          python gemini_email_bot.py
