name: Gemini Email Bot

on:
  schedule:
    - cron: '* * * * *'   # כל דקה
  workflow_dispatch:

concurrency:
  group: gemini-email-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore answered_ids cache
        uses: actions/cache@v4
        with:
          path: answered_ids.txt
          key: answered-ids-${{ github.run_id }}
          restore-keys: |
            answered-ids-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests markdown

      - name: Run bot
        env:
          EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          LOOKBACK_MINUTES: "240"
          MAX_EMAILS_PER_RUN: "25"
          DEFAULT_MAX_OUTPUT_TOKENS: "3000"
          STATE_FILE: "answered_ids.txt"
          STATE_MAX_IDS: "10000"
          MAX_THREAD_MESSAGES: "20"
          MAX_TRANSCRIPT_CHARS: "20000"
          MAX_SINGLE_MSG_CHARS: "3500"
          MAX_EXACT_FIX_ATTEMPTS: "4"
          MIN_NONEXACT_WORDS: "60"
          MAX_REWRITE_ATTEMPTS: "2"
        run: |
          python gemini_email_bot.py
